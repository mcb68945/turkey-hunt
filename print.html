<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Turkey Hunt — Print Codes</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  body { font-family: system-ui, sans-serif; margin:24px; color:#222; }
  .noprint { background:#fff4e6; border:1px solid #f0c38f; padding:12px 16px; border-radius:8px; margin-bottom:20px; }
  .signin { text-align:center; page-break-after:always; padding-top:40px; }
  .signin h1 { font-size:42px; margin:0 0 8px; }
  .signin p { font-size:20px; margin:0 0 24px; }
  .signin .qr { display:inline-block; }
  .grid { display:grid; grid-template-columns:repeat(4, 1fr); gap:18px 12px; }
  .cell { text-align:center; break-inside:avoid; border:1px dashed #bbb; padding:8px 4px 4px; }
  .cell .qr { display:inline-block; }
  .cell small { display:block; font-size:11px; color:#666; margin-top:4px; }
  table { border-collapse:collapse; width:100%; margin-top:8px; }
  td { border:1px solid #ccc; padding:6px 8px; font-size:13px; } td:first-child { width:60px; }
  .list { page-break-before:always; }
  @media print { .noprint { display:none; } body { margin:0.4in; } }
</style>
</head>
<body>
<div class="noprint">
  <b>Print this page.</b> Page 1 is the sign-in code (each kid scans it once at the start).
  Then 25 tag codes to cut out and hide, and a checklist to write down where each one went.
  <div id="base" style="margin-top:6px;font-size:13px;color:#555"></div>
</div>

<div class="signin">
  <h1>🦃 TURKEY HUNT</h1>
  <p>Scan me first and tap your name!</p>
  <div class="qr" id="signinQR"></div>
</div>

<div class="grid" id="grid"></div>

<div class="list">
  <h2>Hiding spots (keep this, don't show the kids)</h2>
  <table id="list"></table>
</div>

<script src="config.js"></script>
<script>
const base = location.href.replace(/[^/]*(\?.*)?(#.*)?$/, "") + "index.html";
document.getElementById("base").textContent = "Codes point to: " + base;
new QRCode(document.getElementById("signinQR"), { text: base, width: 320, height: 320, correctLevel: QRCode.CorrectLevel.M });
const grid = document.getElementById("grid"), list = document.getElementById("list");
for (let t = 1; t <= TAG_COUNT; t++) {
  const cell = document.createElement("div"); cell.className = "cell";
  const q = document.createElement("div"); q.className = "qr"; cell.appendChild(q);
  const s = document.createElement("small"); s.textContent = "#" + t; cell.appendChild(s);
  grid.appendChild(cell);
  new QRCode(q, { text: base + "?t=" + tokenFor(t), width: 130, height: 130, correctLevel: QRCode.CorrectLevel.M });
  list.insertAdjacentHTML("beforeend", `<tr><td>#${t}</td><td></td></tr>`);
}
</script>
</body>
</html>
